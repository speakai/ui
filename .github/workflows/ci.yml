name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run test

      - name: Cache demo build
        id: demo-cache
        uses: actions/cache@v4
        with:
          path: demo/out
          key: demo-build-${{ hashFiles('src/**', 'demo/**', '!demo/node_modules/**', '!demo/out/**', '!demo/.next/**') }}

      - name: Build library
        run: npm run build

      - name: Build demo
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: cd demo && npm install && npm run build

      - name: Drop unrelated third-party apt repos (Microsoft 403s break apt-get update)
        run: sudo grep -rlZ packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0r rm -f
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
